<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="app.js"></script>
</head>

<body class="body">
    <header class="header">
        <img src="./assets/img/eisenhower-matrix.jpg" class="header-img" alt="pic matrix">
        <a class="header-link" href="https://goal-life.com/page/method/matrix-eisenhower"> Want more details?
        </a>
    </header>
    <main class="main">
        <div class="add-task">
            <label for="new-task" class="label-add-task">Add Item</label>
            <div class="task-row-wrapper">
                <input id="new-task" class="task input-task" type="text">
                <button class="btn" type="button">Add</button>
            </div>
        </div>
        <h3 class="main-title">Todo</h3>
        <ul class="list" id="incomplete-tasks">
            <li class="list-item">
                <input type="checkbox" class="list-input-checkbox">
                <label class="task label-task">Pay Bills</label>
                <input type="text" class="task list-input">
                <button type="button" class="btn edit">Edit</button>
                <button type="button" class="btn delete">
                    <img src="./assets/svg/remove.svg" class="img-del" alt="icon">
                </button>
            </li>
            <li class="edit-Mode list-item">
                <input type="checkbox" class="list-input-checkbox">
                <label class="task label-task">Go Shopping</label>
                <input type="text" value="Go Shopping" class="task list-input">
                <button type="button" class="btn edit">Save</button>
                <button type="button" class="btn delete">
                    <img src="./assets/svg/remove.svg" class="img-del" alt="icon">
                </button>
            </li>
        </ul>
        <h3>Completed</h3>
        <ul class="list" id="completed-tasks">
            <li class="list-item">
                <input type="checkbox" checked class="list-input-checkbox">
                <label class="task label-task" id="list-item-task">See the Doctor</label>
                <input type="text" class="task list-input">
                <button type="button" class="btn edit">Edit</button>
                <button type="button" class="btn delete">
                    <img src="./assets/svg/remove.svg" class="img-del" alt="icon">
                </button>
            </li>
        </ul>
    </main>
    <script type="text/javascript" SRC="app.js"></script>
</body>

</html>
